[package]
name = "just-stop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0" }
chrono = { version = "0.4" }
confique = { version = "0.3.1", features = ["toml"] }
crossbeam-channel = "0.5.15"
ctrlc = { version = "3.4" }
etcetera = { version = "0.9.0" }
ffmpeg-sidecar = { version = "2.1.0", features = ["named_pipes"] }
inquire = { version = "0.7.5" }
nix = { version = "0.31.1", features = ["fs"] }
serde = { version = "*", features = ["derive"] }
toml = { version = "0.8" }
v4l = { version = "0.14.0" }
